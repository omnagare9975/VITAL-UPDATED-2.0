services:
  # ── Express API Server ────────────────────────────────────────────────────────
  - type: web
    name: vital-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODBURL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 3001
    autoDeploy: true

  # ── PDF Proxy Server ──────────────────────────────────────────────────────────
  - type: web
    name: vital-pdf-proxy
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node proxyserver.cjs
    envVars:
      - key: PORT
        value: 3003
    autoDeploy: true
